services:
  
  postgresql:
    image: postgres:latest
    container_name: devmockin_db
    environment: &db_creds
      PGDATA: /var/lib/postgresql/data/devmockin
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/devmockin

  devmockin_backend:
    environment: &backend_env
      <<: *db_creds
      POSTGRES_HOST: postgresql
      DEBUG: ${DEBUG}
      SECRET_KEY: ${SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
    container_name: devmockin_backend
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-dev
    command: sh -c "python smtp_server.py & gunicorn -c gunicorn.dev.conf.py devmockin.wsgi:application"
    volumes:
      - ./backend:/app
    expose:
      - "8000" 
    depends_on:
      - postgresql
  redis:
    container_name: devmockin_redis
    image: redis:6
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  devmockin_frontend:
    container_name: devmockin_frontend
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-dev
    command: npm run dev -- --host 0.0.0.0
    environment:
      CHOKIDAR_USEPOLLING: true
      VITE_CLIENT_ADMIN_MAIL: ${VITE_CLIENT_ADMIN_MAIL}
      VITE_CLIENT_ADMIN_PASSWORD: ${VITE_CLIENT_ADMIN_PASSWORD}
    volumes:
      - ./client:/app
      - front_node_modules:/app/node_modules/
    ports:
      - "5173:5173"

  celery: 
    container_name: devmockin_celery
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-dev
    environment: 
      <<: *backend_env
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_REDIS_URL: ${CELERY_RESULT_REDIS_URL}
    command: [ "celery", "-A", "devmockin", "worker", "--loglevel", "INFO" ]
    volumes:
      - ./backend:/app
    depends_on:
      - postgresql
      - redis

  nginx:
    container_name: devmockin_nginx
    image: nginx:latest
    ports: 
      - "80:80"
    volumes:
      - ./backend/nginx/conf.d/:/etc/nginx/conf.d
      - ./backend/static:/app/static
      - ./backend/media:/app/media
    depends_on:
      - devmockin_backend
  
volumes:
  front_node_modules:
    driver: local
  postgres_data:
  redis_data:

networks:
  default:
    name: devmockin_net
    external: true